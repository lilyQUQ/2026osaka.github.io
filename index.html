  <style>
    :root {
      --bg-cream: #FDF8EE;
      --bg-card: #FFFDF8;
      --bg-soft: #F6EFE0;
      --ink-main: #3B2F2A;
      --ink-muted: #6E5C52;
      --accent-maple: #D96B43;
      --accent-ginkgo: #E6A82E;
      --accent-matcha: #6C8E68;
      --accent-sky: #5A8FA8;
      --border-sketch: #E5D6BE;
      --font-scale: 1;
    }

    html.large-font {
      --font-scale: 1.18;
    }

    body {
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-cream);
      background-image:
        radial-gradient(#E8D8BE 1.1px, transparent 1.1px),
        radial-gradient(#F0E4CE 1px, var(--bg-cream) 1px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      color: var(--ink-main);
      font-size: calc(18px * var(--font-scale));
      line-height: 1.7;
      -webkit-tap-highlight-color: rgba(217, 107, 67, 0.18);
    }

    .sketch-card {
      background: var(--bg-card);
      border: 2.5px solid var(--border-sketch);
      border-radius: 26px;
      box-shadow: 0 6px 0 #EADBC3, 0 12px 24px rgba(88, 63, 45, 0.06);
    }

    .sketch-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .sketch-btn:active {
      transform: translateY(2px);
    }

    .day-pill {
      border: 2.5px solid #E2D1B5;
      background: #FFFDF9;
      color: #5A473D;
      border-radius: 20px;
      box-shadow: 0 4px 0 #E6D6BC;
    }

    .day-pill.active {
      background: #D96B43;
      border-color: #B8512C;
      color: #FFFFFF;
      box-shadow: 0 4px 0 #9E401E;
      transform: translateY(-2px);
    }

    .node-pin {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .node-pin:hover,
    .node-pin.selected {
      transform: translateY(-4px) scale(1.03);
    }

    .dashed-path {
      stroke-dasharray: 8 8;
      animation: dashFlow 22s linear infinite;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -160;
      }
    }

    @media print {
      body {
        background: #FFFFFF !important;
        font-size: 13pt !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only-header {
        display: block !important;
      }
      .sketch-card {
        box-shadow: none !important;
        border: 1.5px solid #C9B596 !important;
        break-inside: avoid;
        margin-bottom: 14px !important;
      }
      .page-break {
        break-before: page;
      }
    }

    .print-only-header {
      display: none;
    }
  </style>
</head>

    // =========================================================================
    // 應用程式狀態管理
    // =========================================================================
    let state = {
      activeDayIndex: 0,
      viewMode: 'itinerary', // 'itinerary' | 'tips'
      sundayPlan: 'main',    // 'main' | 'backup'
      selectedNodeId: null,
      largeFont: false
    };

    function getCurrentDayData(dayIndex = state.activeDayIndex) {
      const day = TRIP_DAYS[dayIndex];
      if (day.id === 'day3') {
        const plan = day.plans[state.sundayPlan];
        return {
          ...day,
          activePlanKey: state.sundayPlan,
          planBadge: plan.planBadge,
          wakeNote: plan.wakeNote,
          nodes: plan.nodes,
          timeline: plan.timeline
        };
      }
      return day;
    }

    function toggleFontSize() {
      state.largeFont = !state.largeFont;
      document.documentElement.classList.toggle('large-font', state.largeFont);
      const btn = document.getElementById('fontToggleBtn');
      const label = document.getElementById('fontToggleLabel');
      btn.setAttribute('aria-pressed', String(state.largeFont));
      label.textContent = state.largeFont ? '字體：特大舒適版（點我還原）' : '字體：標準（點我放大）';
      render();
    }

    function selectDay(index) {
      state.activeDayIndex = index;
      const dayData = getCurrentDayData(index);
      state.selectedNodeId = dayData.nodes[0]?.id || null;
      render();
    }

    function switchViewMode(mode) {
      state.viewMode = mode;
      render();
    }

    function setSundayPlan(planKey) {
      state.sundayPlan = planKey;
      const dayData = getCurrentDayData(2);
      state.selectedNodeId = dayData.nodes[0]?.id || null;
      render();
    }

    function selectNode(nodeId) {
      state.selectedNodeId = nodeId;
      renderNodeDetailBox();
      highlightSelectedNodePins();
    }

    function highlightSelectedNodePins() {
      document.querySelectorAll('[data-node-pin]').forEach((el) => {
        const isSelected = el.getAttribute('data-node-pin') === state.selectedNodeId;
        el.classList.toggle('selected', isSelected);
        el.classList.toggle('ring-4', isSelected);
        el.classList.toggle('ring-[#E6A82E]', isSelected);
      });
    }

    // =========================================================================
    // 渲染日期分頁按鈕與模式狀態
    // =========================================================================
    function renderNavControls() {
      const dayTabsEl = document.getElementById('dayTabs');
      dayTabsEl.innerHTML = TRIP_DAYS.map((day, idx) => {
        const isActive = idx === state.activeDayIndex;
        return `
          <button
            type="button"
            onclick="selectDay(${idx})"
            class="sketch-btn day-pill p-2.5 sm:p-3 text-left flex flex-col justify-between ${isActive ? 'active' : ''}"
            aria-current="${isActive ? 'page' : 'false'}"
          >
            <span class="font-black" style="font-size: calc(1rem * var(--font-scale));">${day.tabLabel}</span>
            <span class="font-medium truncate ${isActive ? 'text-[#FFF4E8]' : 'text-[#7A6558]'}" style="font-size: calc(0.8rem * var(--font-scale));">${day.tabSub}</span>
          </button>
        `;
      }).join('');

      // 模式按鈕樣式
      const itinBtn = document.getElementById('modeItineraryBtn');
      const tipsBtn = document.getElementById('modeTipsBtn');
      if (state.viewMode === 'itinerary') {
        itinBtn.className = 'sketch-btn flex-1 sm:flex-none px-4 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-[#D96B43] text-white shadow';
        tipsBtn.className = 'sketch-btn flex-1 sm:flex-none px-4 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-white text-[#4A382F] border-2 border-[#DFCEB2]';
      } else {
        tipsBtn.className = 'sketch-btn flex-1 sm:flex-none px-4 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-[#6C8E68] text-white shadow';
        itinBtn.className = 'sketch-btn flex-1 sm:flex-none px-4 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 bg-white text-[#4A382F] border-2 border-[#DFCEB2]';
      }

      // 週日（11/29）專屬主案/備案切換顯示
      const sundaySwitch = document.getElementById('sundayPlanSwitch');
      const isSunday = TRIP_DAYS[state.activeDayIndex].id === 'day3';
      sundaySwitch.classList.toggle('hidden', !isSunday);
      sundaySwitch.classList.toggle('flex', isSunday);

      const mainBtn = document.getElementById('planMainBtn');
      const backupBtn = document.getElementById('planBackupBtn');
      if (state.sundayPlan === 'main') {
        mainBtn.className = 'sketch-btn px-3 py-1.5 rounded-lg font-bold bg-[#E6A82E] text-[#2F2107] shadow-sm';
        backupBtn.className = 'sketch-btn px-3 py-1.5 rounded-lg font-bold bg-[#F5EDE0] text-[#6E5C52]';
      } else {
        backupBtn.className = 'sketch-btn px-3 py-1.5 rounded-lg font-bold bg-[#6C8E68] text-white shadow-sm';

      }
    }

    // 渲染精簡每日插畫路線圖（SVG 串聯節點＋可點擊查看貼心提醒）
    // =========================================================================
    function renderRouteIllustrationMap(dayData) {
      const nodes = dayData.nodes;
      const currentNode = nodes.find((n) => n.id === state.selectedNodeId) || nodes[0];
      if (currentNode && state.selectedNodeId !== currentNode.id) {
        state.selectedNodeId = currentNode.id;
      }

      // 計算 SVG 曲線串聯高度（依節點數量自適應，避免擁擠）
      const rows = Math.ceil(nodes.length / 2);
      const svgHeight = Math.max(150, rows * 115 + 25);

      const pinButtonsHtml = nodes.map((node, i) => {
        const isSelected = currentNode && node.id === currentNode.id;
        return `
          <button
            type="button"
            data-node-pin="${node.id}"
            onclick="selectNode('${node.id}')"
            class="node-pin sketch-btn text-left p-3 rounded-2xl border-2 bg-[#FFFDF8] flex items-start gap-2.5 ${
              isSelected ? 'selected ring-4 ring-[#E6A82E] border-[#D96B43]' : 'border-[#E5D4B7] hover:border-[#D96B43]'

          >
            <span class="w-7 h-7 rounded-full bg-[#D96B43] text-white font-black flex items-center justify-center shrink-0 mt-0.5" style="font-size: calc(0.85rem * var(--font-scale));">
              ${i + 1}
            </span>
            <div class="min-w-0 flex-1">
              <div class="font-bold text-[#9C5714]" style="font-size: calc(0.78rem * var(--font-scale));">${node.time}</div>
              <div class="font-black text-[#3B2F2A] leading-snug break-words" style="font-size: calc(0.95rem * var(--font-scale));">${node.place}</div>
              <div class="mt-1 inline-block px-2 py-0.5 rounded-full bg-[#F7EFE0] text-[#5C493E] font-medium" style="font-size: calc(0.75rem * var(--font-scale));">
                ${node.tag}
              </div>
            </div>
          </button>
        `;
      }).join('');

      return `
        <section class="sketch-card p-4 sm:p-6">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-3">
            <div>
              <span class="inline-block px-3 py-0.5 rounded-full border font-bold ${dayData.badgeColor}" style="font-size: calc(0.84rem * var(--font-scale));">
                ${dayData.dateTitle}${dayData.planBadge ? ` ・ ${dayData.planBadge}` : ''}
              </span>
              <h2 class="font-black text-[#3B2F2A] mt-1" style="font-size: calc(1.32rem * var(--font-scale));">
                ${dayData.themeTitle}
              </h2>
            </div>
          </div>

          <p class="text-[#5A483E] mb-4" style="font-size: calc(0.98rem * var(--font-scale));">
            ${dayData.summary}
          </p>

          ${dayData.wakeNote ? `
            <div class="mb-4 p-3.5 rounded-2xl bg-[#FFF6E0] border-2 border-[#ECC678] text-[#6B470C] font-bold flex items-start gap-2.5" style="font-size: calc(0.94rem * var(--font-scale));">
              <span aria-hidden="true" class="text-xl leading-none">☀️</span>
              <span>${dayData.wakeNote}</span>
            </div>

          <!-- 可愛手繪插畫路線帶 -->

                <span>當日路線節點（點選任一景點看貼心提醒）</span>
              </span>
            </div>

            <!-- 手繪路線裝飾線（桌機顯示串聯手繪路徑） -->
            <div class="relative">
              <svg
                viewBox="0 0 800 ${svgHeight}"
                class="hidden md:block w-full h-10 mb-1 pointer-events-none"
                preserveAspectRatio="none"
                aria-hidden="true"
              >
                <path
                  d="M 40 20 Q 200 6, 400 20 T 760 20"
                  stroke="#D96B43"
                  stroke-width="4"
                  fill="none"
                  class="dashed-path"
                  stroke-linecap="round"
                />
                <circle cx="40" cy="20" r="7" fill="#E6A82E" />

              </svg>

              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                ${pinButtonsHtml}

            </div>

            <!-- 選中景點的貼心提醒盒 -->
            <div id="selectedNodeDetailBox" class="mt-4"></div>
          </div>
        </section>
      `;

      const box = document.getElementById('selectedNodeDetailBox');

            </div>
          </div>

          <!-- 通用長輩貼心守則 -->
          <div class="p-4 rounded-2xl bg-[#FAF3E6] border-2 border-[#E3D1B2]">
            <h3 class="font-black text-[#3B2F2A] mb-2 flex items-center gap-2" style="font-size: calc(1.08rem * var(--font-scale));">
              <span>🧣</span>
              <span>出發前＆每日隨身小叮嚀</span>
            </h3>
            <ul class="space-y-2 text-[#4F3E35]" style="font-size: calc(0.95rem * var(--font-scale));">
              <li>• <strong>洋蔥式保暖＋好走鞋：</strong>11 月底至 12 月初早晚溫差較大，建議穿方便穿脫的保暖外套與防滑好走的健走鞋。</li>
              <li>• <strong>走累就歇腳、不勉強爬高：</strong>伏見稻荷大社與寺院階梯可依長輩體力量力而為，隨時利用百貨座椅、咖啡廳與計程車省力。</li>
              <li>• <strong>隨身物品與飯店資訊：</strong>出門前確認護照、交通卡與常備藥品，回程搭車日（12/1）務必留足時間準時出發。</li>
            </ul>
          </div>
        </section>
      `;
    }

    // =========================================================================
    // 主渲染函式
    // =========================================================================
    function render() {
      renderNavControls();
      const appContent = document.getElementById('appContent');
      const dayData = getCurrentDayData();

      if (state.viewMode === 'tips') {
        appContent.innerHTML = renderElderlyTipsView();
      } else {
        appContent.innerHTML = `
          ${renderRouteIllustrationMap(dayData)}
          ${renderDailyItineraryCards(dayData)}
        `;
        renderNodeDetailBox();
      }
    }

    // 啟動初始化
    window.addEventListener('DOMContentLoaded', () => {
      state.selectedNodeId = getCurrentDayData(0).nodes[0]?.id || null;
      render();
    });
  </script>
</body>
</html>
